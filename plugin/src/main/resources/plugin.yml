name: "SkyHeads"
version: "${version}"
main: "me.denarydev.heads.HeadsPlugin"
api-version: "1.16"
softdepend: [ "PlaceholderAPI" ]
author: "DenaryDev"
provides: [ "HeadDatabase" ]

commands:
  heads:
    aliases: [ "head", "hdb" ]

permissions:
  # Super permission
  skyheads.admin:
    description: "Admin permission to access all plugin features"
    default: op
    children:
      - "skyheads.command.*"

  # Command permissions
  skyheads.command.*:
    description: "Allows to use all commands"
    default: op
    children:
      - "skyheads.command.open"
      - "skyheads.command.reload"
  # /heads open or /heads
  skyheads.command.open:
    description: "Allows to open heads menu"
    default: true
  # /heads reload
  skyheads.command.reload:
    description: "Allows to reload plugin configurations and cache"
    default: op
