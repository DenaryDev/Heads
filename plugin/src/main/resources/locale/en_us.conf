# SkyHeads messages file
# Generated on ${version}
# Language: English (United States)

# General messages
general {
  search {
    input="<i>Enter a search term or /cancel to cancel."
    searching="<gray><i>Searching for '<args>'..."
    cancelled="<gray><i>Search cancelled."
  }
}

# Errors messages
error {
  no-permission="<red>You don't have enough permissions to use this!"
  players-only="<red>Only players can use this command!"
  database-not-loaded="<red>Failed to load heads database, please try again later!"
  plugin-not-loaded="<red>he plugin could not load due to incorrect configuration! There is more information about this in the console."
}

# Categories names
category {
  alphabet="Alphabet"
  animals="Animals"
  blocks="Blocks"
  decoration="Decorations"
  food_drinks="Food and drinks"
  humans="Humans"
  humanoid="Humanoids"
  miscellaneous="Miscellaneous"
  monsters="Monsters"
  plants="Plants"
  other="Other"
  recent="Recently Added"
  favorites="Your Favorites"
  search="Search Results"
}

# Commands messages
command {
  generic {
    usage="<red>Use: <usage>"
  }
  help {
    usage="/<label> help to see a list of available commands."
    header="<light_blue>Heads <dark_gray>| <yellow>Available commands:\n<gray><i>Parameters in <> are required, but in [] are optional"
    command="<dark_gray><b>*</b> <gold><usage> <gray>- <yellow><info>"
    empty="<red>**You don't seem to have access to any commands**"
  }
  open {
    info="<i>Opens heads menu."
    usage="/<label>"
  }
  reload {
    info="<i>Reloads the plugin configuration."
    usage="/<label> reload"
    success="<green>Plugin configuration reloaded successfully."
    database {
      success="<green>Database successfully loaded in <time>ms."
      failed="<red>Failed to load database, check console for more info!"
    }
  }
  search {
    info="<i>Searches heads by names and tags."
    usage="/<label> search <name|tag>"
  }
}

# Gui messages
gui {
  common {
    item {
      search {
        name="<yellow>Search"
        lore=[
          "<gray>For search use:"
          "<gray>/heads search <name|tag>"
          #"<gray>Left click to search"
          #"<gray>   by tags and names."
          #"<gray>Right click to search"
          #"<gray>   by names only."
        ]
      }
      back {
        name="<red>Back to categories"
      }
    }
  }
  overview {
    title="Head Database (<count> heads)"
    item {
      category {
        name="<yellow><name>"
        lore=[
          "<gray><count> heads"
        ]
      }
    }
  }
  heads {
    title="<name> (<count> heads)"
    item {
      head {
        name="<blue><name>"
        lore=[
          "<dark_gray><category>"
          "<dark_gray><tags>"
          "<dark_gray>ID: <gray><id>"
        ]
      }
      page {
        name="<gray>Page <page>"
        lore=[
          "<dark_gray><id>"
        ]
      }
      empty {
        name="<red>Empty"
      }
    }
  }
}