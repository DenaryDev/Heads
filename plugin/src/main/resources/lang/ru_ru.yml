# HidePlayers messages file
# Generated on ${version}
# Язык: Русский (Российская Федерация)

# General messages
general:
  search:
    input: "&oВведите поисковой запрос или /cancel для отмены."
    searching: "&oВыполняю поиск по '%args%'..."
    cancelled: "&7Поиск отменён."

# Errors messages
error:
  no-permission: "&cУ вас недостаточно прав, чтобы использовать это!"
  players-only: "&cЭту команду могут использовать только игроки!"
  database-not-loaded: "&cБаза данных ещё не загрузилась, попробуйте позднее!"

# Названия категорий
category:
  alphabet: "Алфавит"
  animals: "Животные"
  blocks: "Блоки"
  decoration: "Декорации"
  food_drinks: "Еда и напитки"
  humans: "Люди"
  humanoid: "Гуманоиды"
  miscellaneous: "Разнообразное"
  monsters: "Монстры"
  plants: "Растения"
  custom: "Кастомные головы"
  recent: "Недавние головы"

# Сообщения команд
command:
  generic:
    usage: "&cИспользуйте: %usage%"
  help:
    usage: "/%label% help для просмотра списка доступных команд."
    header: |-
      &bHeads &8| &eДоступные команды:
      &7&oПараметры в <> обязательны, а в [] не обязательны
    command: "&8&l* &6%usage% &7- &e%info%"
    empty: "&c**Кажется, у вас нет доступа к каким-либо командам**"
  open:
    info: "&oОткрывает меню голов."
    usage: "/%label%"
  reload:
    info: "&oПерезагружает конфигурацию плагина."
    usage: "/%label% reload"
    success: "&aКонфигурация плагина успешно перезагружена."
  search:
    info: "&oSearches heads by names and tags."
    usage: "/%label% search <args>"

# Сообщения меню
gui:
  common:
    item:
      search:
        name: "&eПоиск"
        lore:
          - "&7ЛКМ, чтобы искать"
          - "&7   по названиям и тегам"
          - "&7ПКМ, чтобы искать"
          - "&7   только по названиям"
      back:
        name: "&cВернуться к категориям"
        lore:
          - "&7Нажмите, чтобы вернуться обратно"
          - "&7в меню категорий"
  overview:
    title: "Головы (%count% загружено)"
    item:
      category:
        name: "&e%name%"
        lore:
          - "&7%count% голов"
  heads:
    title:
      category: "%name% (%count% голов)"
      search: "Результаты поиска (%count% голов)"
      favorites: "Избранное (%count% голов)"
      recent: "Недавние головы (%count% голов)"
    item:
      head:
        name: "&9%name%"
        lore:
          - "&8%category%"
          - "&8%tags%"
          - "&8ID: &7%id%"
      page:
        name: "&7Страница %page%"
        lore:
          category:
            - "&8%id%"
          search:
            - "&8Результаты поиска"
          favorites:
            - "&8Избранное"
          recent:
            - "&8Недавние головы"
      empty:
        name: "&cПусто"
