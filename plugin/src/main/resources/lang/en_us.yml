# HidePlayers messages file
# Generated on ${version}
# Language: English (United States)

# General messages
general:
  search:
    input: "&oEnter a search term or /cancel to cancel."
    searching: "&oSearching for '%args%'..."
    cancelled: "&7Search cancelled."

# Errors messages
error:
  no-permission: "&cYou don't have enough permissions to use this!"
  players-only: "&cOnly players can use this command!"
  database-not-loaded: "&cFailed to load heads database, please try again later!"

# Categories names
category:
  alphabet: "Alphabet"
  animals: "Animals"
  blocks: "Blocks"
  decoration: "Decorations"
  food_drinks: "Food and drinks"
  humans: "Humans"
  humanoid: "Humanoids"
  miscellaneous: "Miscellaneous"
  monsters: "Monsters"
  plants: "Plants"
  custom: "Custom"
  recent: "Recently Added"

# Commands messages
command:
  generic:
    usage: "&cUse: %usage%"
  help:
    usage: "/%label% help to see a list of available commands."
    header: |-
      &bHeads &8| &eAvailable commands:
      &7&oParameters in <> are required, but in [] are optional
    command: "&8&l* &6%usage% &7- &e%info%"
    empty: "&c**You don't seem to have access to any commands**"
  open:
    info: "&oOpens heads menu."
    usage: "/%label%"
  reload:
    info: "&oReloads the plugin configuration."
    usage: "/%label% reload"
    success: "&aPlugin configuration reloaded successfully."
  search:
    info: "&oSearches heads by names and tags."
    usage: "/%label% search <args>"

# Gui messages
gui:
  common:
    item:
      search:
        name: "&eSearch"
        lore:
          - "&7Left click to search"
          - "&7   by tags and names."
          - "&7Right click to search"
          - "&7   by names only."
      back:
        name: "&cBack to categories"
        lore:
          - "&7Click to go back to categories"
  overview:
    title: "Head Database (%count% heads)"
    item:
      category:
        name: "&e%name%"
        lore:
          - "&7%count% heads"
  heads:
    title:
      category: "%name% (%count% heads)"
      search: "Search Results (%count% heads)"
      favorites: "Your Favorites (%count% heads)"
      recent: "Recently Added (%count% heads)"
    item:
      head:
        name: "&9%name%"
        lore:
          - "&8%category%"
          - "&8%tags%"
          - "&8ID: &7%id%"
      page:
        name: "&7Page %page%"
        lore:
          category:
            - "&8%id%"
          search:
            - "&8Search Results"
          favorites:
            - "&8Favorites"
          recent:
            - "&8Recently Added"
      empty:
        name: "&cEmpty"
